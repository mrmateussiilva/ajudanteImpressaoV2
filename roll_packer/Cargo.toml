[package]
name = "roll_packer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.28.1"
egui = "0.28.1"
image = { version = "0.25.10", features = ["jpeg", "png", "webp"] }
rayon = "1.12.0"
rfd = "0.17.2"
imageproc = "0.25"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
jpeg-encoder = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
